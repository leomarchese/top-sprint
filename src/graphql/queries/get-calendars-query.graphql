query GetCalendars {
  seasons(
    filter: { status: { _eq: "published" } }
    sort: "-date_created"
    limit: 1
  ) {
    id
    name
    rounds {
        id,
        name
        link
        date
        raceWinner
        track {
            name
            location
            flag {
                id
            }
        }
    }
  }
}
