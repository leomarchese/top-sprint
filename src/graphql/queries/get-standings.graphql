query GetTeams {
  drivers(filter: { status: { _eq: "published" } }) {
    id
    name
    number
    stream
    city
    equipment
    grid
    team {
      name
      color
    }
    photo {
	    id
	  }
  }
  teams(filter: { status: { _eq: "published" } }) {
    id
    name
    color
    photo {
      id
    }
  }
}
